<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Realtime Tutor: learn songs on guitar, bass, ukulele or piano</title>
    <meta name="description" content="Play along and get note-by-note feedback while you learn songs. Works with a microphone or a MIDI keyboard." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script>
      // Pick the theme before first paint (the app keeps it in sync afterwards).
      try {
        const saved = JSON.parse(localStorage.getItem('rgt.settings') || '{}').theme;
        const dark = saved === 'dark' || ((!saved || saved === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
      <a class="brand" href="#/library" id="brandLink"></a>
      <nav class="app-nav" aria-label="Main" id="mainNav"></nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
